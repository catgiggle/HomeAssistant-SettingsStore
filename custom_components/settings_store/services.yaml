get:
  name: Get value
  description: Retrieves a stored value by ID or by scope and name.
  fields:
    store:
      required: true
      description: Entity ID of the Settings Store sensor (identifies target storage instance).
      example: "sensor.settings_store_main_entries"
      selector:
        entity:
          integration: settings_store
    id:
      required: false
      description: ID of the entry to retrieve; cannot be combined with scope or name.
      example: 1
      selector:
        number:
          min: 0
          mode: box
    name:
      required: false
      description: Setting key name; required when ID is not provided.
      example: "last_run_duration"
      selector:
        text:
    scope:
      required: false
      description: Scope / namespace; defaults to default when retrieving by name and cannot be used with ID.
      example: "irrigation"
      selector:
        text:

list:
  name: List values
  description: Retrieves all stored entries for a given scope from the settings store.
  fields:
    store:
      required: true
      description: Entity ID of the Settings Store sensor (identifies target storage instance).
      example: "sensor.settings_store_main_entries"
      selector:
        entity:
          integration: settings_store
    scope:
      required: false
      default: "default"
      description: Scope / namespace identifier for grouping settings.
      example: "irrigation"
      selector:
        text:

all:
  name: All values
  description: Retrieves all stored entries across all scopes from the settings store.
  fields:
    store:
      required: true
      description: Entity ID of the Settings Store sensor (identifies target storage instance).
      example: "sensor.settings_store_main_entries"
      selector:
        entity:
          integration: settings_store

set:
  name: Set value
  description: Sets a value by scope and name, or updates an existing entry by ID.
  fields:
    store:
      required: true
      description: Entity ID of the Settings Store sensor (identifies target storage instance).
      example: "sensor.settings_store_main_entries"
      selector:
        entity:
          integration: settings_store
    id:
      required: false
      description: ID of the entry to update; cannot be combined with scope or name.
      example: 1
      selector:
        number:
          min: 0
          mode: box
    name:
      required: false
      description: Setting key name; required when ID is not provided.
      example: "last_run_duration"
      selector:
        text:
    scope:
      required: false
      description: Scope / namespace; defaults to default when updating by name and cannot be used with ID.
      example: "irrigation"
      selector:
        text:
    value:
      required: true
      description: Value to store.
      example: "15"
      selector:
        text:

delete:
  name: Delete value
  description: Deletes a setting by ID or by scope and name.
  fields:
    store:
      required: true
      description: Entity ID of the Settings Store sensor (identifies target storage instance).
      example: "sensor.settings_store_main_entries"
      selector:
        entity:
          integration: settings_store
    id:
      required: false
      description: ID of the entry to delete; cannot be combined with scope or name.
      example: 1
      selector:
        number:
          min: 0
          mode: box
    name:
      required: false
      description: Setting key name; required when ID is not provided.
      example: "last_run_duration"
      selector:
        text:
    scope:
      required: false
      description: Scope / namespace; defaults to default when deleting by name and cannot be used with ID.
      example: "irrigation"
      selector:
        text:

clear:
  name: Clear all values
  description: Removes all stored entries from the instance's database.
  fields:
    store:
      required: true
      description: Entity ID of the Settings Store sensor (identifies target storage instance).
      example: "sensor.settings_store_main_entries"
      selector:
        entity:
          integration: settings_store